<!doctype html>
<html>
<style>
form {
    margin: auto;
    width: 35%;
}
.result {
    margin: auto;
    width: 35%;
    border: 1px solid #ccc;
}
</style>
<head>
    <title>Enter Text</title>
</head>
<form action="{{ url_for('index') }}" method="POST">
    <fieldset>
        <legend>Enter Review:</legend>
        <textarea name="sentiment" rows="10" cols="80" required></textarea>
        <br>
        <br>
        <input type="submit">
    </fieldset>
</form>
<br>
{% if sentiment is not none%}
<div class="result">
    <p style="font-size:30px">The Review is:</p>
    {% if "Pozytywny" in sentiment %}
        <p style="font-size:40px; color: green;">{{ sentiment }}</p>
    {% else %}
        <p style="font-size:40px; color: red;">{{ sentiment }}</p>
    {% endif %}
</div>
{% endif %}
</body>
</html>
