<!doctype html>
<html>
<head>
<title>Enter Text</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #190a24, #588cf6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    width: 70%;
    max-width: 900px;
}

form {
    width: 100%;
}

.result {
    margin-top: 30px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
</style>
</head>
<body>
<div class="container">
<form action="{{ url_for('index') }}" method="POST">
    <fieldset>
        <legend>Enter Review:</legend>
        <textarea name="sentiment" rows="10" cols="80" required></textarea>
        <br>
        <br>
        <input type="submit">
    </fieldset>
</form>
<br>
{% if sentiment is not none%}
<div class="result">
    <p style="font-size:30px">The Review is:</p>
    {% if "Pozytywny" in sentiment %}
        <p style="font-size:40px; color: green;">{{ sentiment }}</p>
    {% else %}
        <p style="font-size:40px; color: red;">{{ sentiment }}</p>
    {% endif %}
</div>
{% endif %}
</div>
</body>
</html>
